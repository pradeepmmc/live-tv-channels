<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Live TV</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0f;
      color: #fff;
      min-height: 100dvh;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 100%);
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, #e50914, #ff6b00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .nav-cats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #b3b3b3;
      font-size: 13.5px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover { color: #fff; }
    .nav-btn.active {
      color: #fff;
      background: rgba(229, 9, 20, 0.25);
      border-bottom: 2px solid #e50914;
    }

    #btn-adult { display: none; }
    #btn-unlock { color: #666; }

    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 10px;
    }

    .player-box {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }

    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .status-bar {
      text-align: center;
      padding: 12px;
      font-size: 14px;
      color: #aaa;
    }
    .status-bar.error { color: #ff6b6b; }

    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px 40px;
    }

    .row-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 24px 0 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .card {
      background: #18181f;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .card:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .card.playing {
      border-color: #e50914;
      box-shadow: 0 0 0 2px #e50914;
    }

    .card-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(145deg, #1c1f2b, #2a2f3d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #555;
    }

    .card-title {
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-msg {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      grid-column: 1 / -1;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #444;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .navbar { padding: 12px 14px; }
      .cards { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
      .card-title { font-size: 11px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">PREMIUM TV</div>
    <div class="nav-cats">
      <button id="btn-sport" class="nav-btn active">⚽ Sports</button>
      <button id="btn-movie" class="nav-btn">🎬 Movies</button>
      <button id="btn-music" class="nav-btn">🎵 Music</button>
      <button id="btn-preach" class="nav-btn">✝️ Preaching</button>
      <button id="btn-srilanka" class="nav-btn">🇱🇰 Sri Lanka</button>
      <button id="btn-animal" class="nav-btn">🦁 Animals</button>
      <button id="btn-adult" class="nav-btn">🔥 18+</button>
      <button id="btn-unlock" class="nav-btn">🔓</button>
    </div>
  </nav>

  <section class="hero">
    <div class="player-box">
      <video id="video" controls playsinline></video>
    </div>
    <div id="status" class="status-bar">කාණ්ඩයක් තෝරා චැනල් එකක් click කරන්න</div>
  </section>

  <section class="content">
    <h2 class="row-title" id="rowTitle">Sports Channels</h2>
    <div id="cards" class="cards">
      <div class="empty-msg">Loading...</div>
    </div>
  </section>

  <div class="footer">Free public streams • Netflix-style Live TV</div>

  <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Live TV Player</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0a0c12 0%, #12151f 50%, #0d1018 100%);
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* soft background glow */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(255, 59, 48, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    main {
      width: 100%;
      max-width: 920px;
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.07);
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header-bar {
      background: linear-gradient(145deg, #1c2030, #141824);
      border-radius: 18px;
      padding: 20px 24px;
      margin-bottom: 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 
        6px 6px 18px rgba(0,0,0,0.5),
        -4px -4px 14px rgba(255,255,255,0.02);
      border-bottom: 3px solid #ff3b30;
    }

    .header-bar::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,59,48,0.6), transparent);
    }

    .header-bar h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.3rem);
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff3b30, #ff9500, #ff3b30);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    /* Category Buttons */
    .category-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: linear-gradient(145deg, #1a1e2c, #222838);
      color: #94a3b8;
      border: none;
      padding: 13px 26px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 
        5px 5px 14px rgba(0,0,0,0.45),
        -3px -3px 10px rgba(255,255,255,0.03);
      position: relative;
      overflow: hidden;
    }

    .cat-btn:hover {
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 7px 7px 18px rgba(0,0,0,0.5);
    }

    .cat-btn.active {
      background: linear-gradient(145deg, #ff4136, #e11d48);
      color: white;
      box-shadow: 
        inset 2px 2px 6px rgba(0,0,0,0.35),
        0 0 22px rgba(255, 59, 48, 0.45);
      transform: translateY(-2px);
    }

    /* Select */
    .select-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      font-weight: 600;
      margin-left: 6px;
    }

    select {
      width: 100%;
      padding: 16px 48px 16px 20px;
      font-size: 16px;
      font-weight: 500;
      background: #12151f;
      color: #e2e8f0;
      border: 1px solid #2a3142;
      border-radius: 14px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    select:focus {
      outline: none;
      border-color: #ff3b30;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.5), 0 0 0 3px rgba(255, 59, 48, 0.15);
    }

    select:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .select-wrapper::after {
      content: '▼';
      font-size: 11px;
      color: #ff3b30;
      position: absolute;
      right: 20px;
      bottom: 19px;
      pointer-events: none;
    }

    /* Status */
    #status {
      min-height: 48px;
      padding: 14px 20px;
      background: linear-gradient(145deg, #1c1216, #161012);
      border-left: 4px solid #ff3b30;
      border-radius: 12px;
      color: #fda4af;
      font-size: 14.5px;
      font-weight: 500;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 3px 3px 12px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    #status.error {
      border-left-color: #fbbf24;
      color: #fde68a;
      background: linear-gradient(145deg, #1c1a12, #161410);
    }

    /* Video Player */
    .video-container {
      position: relative;
      border-radius: 18px;
      padding: 10px;
      background: linear-gradient(145deg, #1a1e2c, #12151f);
      box-shadow: 
        10px 10px 30px rgba(0,0,0,0.6),
        -4px -4px 16px rgba(255,255,255,0.02);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    /* Loading spinner */
    .loading-spinner {
      display: none;
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255,59,48,0.25);
      border-top-color: #ff3b30;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    @media (max-width: 520px) {
      main { padding: 18px; }
      .cat-btn { padding: 11px 18px; font-size: 14px; }
      .header-bar { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="header-bar">
      <h1>PREMIUM LIVE TV</h1>
      <div class="subtitle">Sports • Movies • Music</div>
    </div>

    <div class="category-buttons">
      <button id="btn-sport" class="cat-btn">⚽ Sports</button>
      <button id="btn-movie" class="cat-btn">🎬 Movies</button>
      <button id="btn-music" class="cat-btn">🎵 Music</button>
    </div>

    <div class="select-wrapper">
      <label for="channelSelect">Select Channel / නාලිකාව තෝරන්න</label>
      <select id="channelSelect" disabled>
        <option value="">කාණ්ඩයක් තෝරන්න...</option>
      </select>
    </div>

    <div id="status" role="status" aria-live="polite">
      <div class="loading-spinner" id="spinner"></div>
      <span>✦ කරුණාකර ඉහළින් කාණ්ඩයක් තෝරන්න.</span>
    </div>

    <div class="video-container">
      <video id="video" controls playsinline preload="none"></video>
    </div>
  </main>

  <footer>Premium Live TV Player • Powered by HLS.js</footer>

  <script src="main.js"></script>

  <!-- small enhancement for loading spinner -->
  <script>
    const originalSetStatus = window.setStatus;
    // optional: you can enhance the status function later if needed
  </script>
</body>
</html>

<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Live TV Player</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #0f1115;
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100dvh;
    }
    main {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      margin: 0 0 20px;
      text-align: center;
      color: #ff3b30;
    }
    /* අලුත් කැටගරි බොත්තම් සඳහා ඩිසයින් එක */
    .category-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .cat-btn {
      background: #1c1f26;
      color: #fff;
      border: 1px solid #333;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cat-btn:hover, .cat-btn.active {
      background: #ff3b30;
      border-color: #ff3b30;
      box-shadow: 0 4px 12px rgba(255, 59, 48, 0.4);
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }
    select {
      padding: 12px;
      width: 100%;
      min-height: 48px;
      font-size: 16px;
      background: #1c1f26;
      color: #fff;
      border: 1px solid #444;
      border-radius: 5px;
      cursor: pointer;
    }
    select:focus-visible {
      outline: 2px solid #ff3b30;
      border-color: #ff3b30;
    }
    #status {
      min-height: 24px;
      margin: 12px 0 0;
      line-height: 1.5;
      color: #d5d5d5;
      text-align: center;
    }
    #status.error { color: #ffb4a8; }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Live TV Player</h1>

    <!-- අලුත් Category Buttons -->
    <div class="category-buttons">
      <button id="btn-sport" class="cat-btn">⚽ Sports</button>
      <button id="btn-movie" class="cat-btn">🎬 Movies</button>
      <button id="btn-music" class="cat-btn">🎵 Music</button>
    </div>

    <label for="channelSelect">චැනල් එකක් තෝරන්න</label>
    <select id="channelSelect" disabled>
      <option value="">කාණ්ඩයක් තෝරන්න...</option>
    </select>

    <p id="status" role="status" aria-live="polite">කරුණාකර ඉහළින් කාණ්ඩයක් (Category) තෝරන්න.</p>

    <video id="video" controls playsinline preload="none"></video>
  </main>

  <script src="main.js"></script>
</body>
</html>

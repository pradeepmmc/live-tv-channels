<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Live TV Player</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d0f14 0%, #151821 100%);
      color: #e0e6ed;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    main {
      width: 100%;
      max-width: 850px;
      background: rgba(26, 30, 41, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-bar {
      background: linear-gradient(145deg, #212533, #181b25);
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 25px;
      box-shadow: 5px 5px 15px #0b0c11, -5px -5px 15px #252a39;
      text-align: center;
      border-bottom: 2px solid #ff3b30;
    }
    .header-bar h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      background: linear-gradient(90deg, #ff3b30, #ff9500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .category-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .cat-btn {
      background: linear-gradient(145deg, #1c1f2b, #212634);
      color: #a0aec0;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4), -4px -4px 10px rgba(255, 255, 255, 0.03);
    }
    .cat-btn:hover {
      color: #fff;
      transform: translateY(-2px);
    }
    .cat-btn.active {
      background: linear-gradient(145deg, #ff4136, #dc2f25);
      color: #fff;
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 59, 48, 0.4);
    }

    .select-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      color: #8b9bb4;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-left: 5px;
    }
    select {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 500;
      background: #11131a;
      color: #fff;
      border: 1px solid #2a2f40;
      border-radius: 12px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.6), inset -4px -4px 8px rgba(255,255,255,0.02);
      transition: 0.3s;
    }
    select:focus-visible {
      outline: none;
      border-color: #ff3b30;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.6), 0 0 10px rgba(255, 59, 48, 0.3);
    }
    .select-wrapper::after {
      content: '▼';
      font-size: 12px;
      color: #ff3b30;
      position: absolute;
      right: 20px;
      bottom: 18px;
      pointer-events: none;
    }

    #status {
      min-height: 24px;
      padding: 12px 20px;
      background: linear-gradient(145deg, #241416, #1a1012);
      border-left: 4px solid #ff3b30;
      border-radius: 8px;
      color: #ffb8b8;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }
    #status.error { 
      border-left-color: #ffcc00; 
      color: #ffd633; 
    }

    .video-container {
      position: relative;
      border-radius: 12px;
      padding: 8px;
      background: linear-gradient(145deg, #1f2330, #151821);
      box-shadow: 8px 8px 20px rgba(0,0,0,0.6), -4px -4px 15px rgba(255,255,255,0.02);
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 8px;
      box-shadow: inset 0 0 20px rgba(0,0,0,1);
    }

    @media (max-width: 480px) {
      main { padding: 15px; }
      .cat-btn { padding: 10px 15px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="header-bar">
      <h1>LIVE TV PLAYER</h1>
    </div>

    <div class="category-buttons">
      <button id="btn-sport" class="cat-btn">⚽ Sports</button>
      <button id="btn-movie" class="cat-btn">🎬 Movies</button>
      <button id="btn-music" class="cat-btn">🎵 Music</button>
    </div>

    <div class="select-wrapper">
      <label for="channelSelect">Select Channel / නාලිකාව තෝරන්න</label>
      <select id="channelSelect" disabled>
        <option value="">කාණ්ඩයක් තෝරන්න...</option>
      </select>
    </div>

    <div id="status" role="status" aria-live="polite">
      ✦ කරුණාකර ඉහළින් කාණ්ඩයක් තෝරන්න.
    </div>

    <div class="video-container">
      <video id="video" controls playsinline preload="none"></video>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
